<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2698df"><title>KaGramm</title>
<style>
:root{--blue:#2698df;--bg:#eef3f7;--panel:#fff;--text:#17212b;--muted:#82909c;--line:#e8edf1;--mine:#d9fdd3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Arial;color:var(--text);height:100dvh;overflow:hidden}
.app{height:100dvh;max-width:1100px;margin:auto;background:var(--panel);display:grid;grid-template-columns:340px 1fr;box-shadow:0 8px 30px #17324a12}
.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.top{height:66px;display:flex;align-items:center;padding:0 16px;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;color:var(--blue);flex:1}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#43b6f5,#147bc4);display:grid;place-items:center;color:white;font-size:20px}
button{cursor:pointer}.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:650}.ghost{border:0;background:transparent;color:var(--muted);font-size:20px;padding:8px}
.search{padding:12px}.search input,.auth input,.composer input,.newchat input{width:100%;border:0;outline:0;border-radius:12px;background:var(--bg);padding:12px 14px;font-size:14px;color:var(--text)}
.chats{overflow-y:auto;overscroll-behavior:contain;flex:1}.chat{display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer}.chat:hover,.chat.sel{background:#eaf5fc}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:#fff;font-weight:750;background:linear-gradient(135deg,#5dbbe9,#3979c7)}
.chatinfo{min-width:0;flex:1}.name{font-weight:700;font-size:14px}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.main{display:flex;flex-direction:column;min-width:0;background:#eaf0f4}.empty{margin:auto;text-align:center;color:var(--muted);padding:24px}.empty h2{color:var(--text)}
.head{height:66px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:10px}.headtitle{font-weight:750}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.messages{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px max(14px,5%);display:flex;flex-direction:column;gap:9px;background-color:#eaf0f4;background-image:radial-gradient(#d2dfe8 .7px,transparent .7px);background-size:18px 18px;scroll-behavior:smooth}
.bubble{max-width:min(78%,520px);padding:10px 12px 7px;border-radius:14px;background:#fff;box-shadow:0 1px 2px #1b354414;font-size:14px;line-height:1.4;overflow-wrap:anywhere;animation:pop .18s ease-out}.bubble.mine{align-self:flex-end;background:var(--mine);border-bottom-right-radius:4px}.bubble.theirs{align-self:flex-start;border-bottom-left-radius:4px}.bubble img,.bubble video{max-width:100%;border-radius:9px;display:block}.meta{font-size:10px;color:#718078;text-align:right;margin-top:5px}.composer{background:var(--panel);padding:10px;display:flex;align-items:center;gap:7px;border-top:1px solid var(--line)}.composer input{flex:1;min-width:0;border-radius:22px}.send{border:0;width:43px;height:43px;border-radius:50%;background:var(--blue);color:white;font-size:18px}.tools{display:flex;gap:2px}.notice{font-size:11px;text-align:center;color:var(--muted);padding:7px;border-top:1px solid var(--line)}
.authwrap{height:100dvh;display:grid;place-items:center;padding:18px;background:linear-gradient(140deg,#e8f6ff,#f8fbfd)}.auth{background:#fff;width:min(100%,390px);padding:26px;border-radius:22px;box-shadow:0 14px 45px #17324a18;display:flex;flex-direction:column;gap:12px}.auth h1{margin:0;color:var(--blue)}.auth p{margin:0;color:var(--muted);font-size:13px}.auth input{background:#f0f4f7}.auth .btn{padding:13px}.error{color:#c0392b;font-size:12px;min-height:16px}
.newchat{padding:12px;display:flex;gap:6px;border-top:1px solid var(--line)}.newchat input{min-width:0}
.hidden{display:none!important}
@keyframes pop{from{opacity:0;transform:translateY(7px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:680px){.app{display:block}.sidebar,.main{height:100dvh;width:100%}.main{display:none}.app.open .sidebar{display:none}.app.open .main{display:flex}.head{height:60px}.messages{padding:14px 10px}.bubble{max-width:88%}}

/* KaGramm dark appearance */
:root{--blue:#5aa9e6;--bg:#17212b;--panel:#17212b;--text:#f2f5f7;--muted:#9aa8b5;--line:#263746;--mine:#2b5278}
body{background:#0e1621;color:var(--text)}
.app{background:#17212b;box-shadow:none}
.sidebar{background:#17212b}
.search input,.auth input,.composer input,.newchat input{background:#242f3d;color:#f2f5f7}
.chat:hover,.chat.sel{background:#202d3b}
.main{background:#0e1621}
.head,.composer{background:#17212b;border-color:#263746}
.messages{background-color:#0e1621;background-image:radial-gradient(#1a2b3d .7px,transparent .7px)}
.bubble{background:#182533;color:#f2f5f7}
.bubble.mine{background:#2b5278}
.authwrap{background:linear-gradient(140deg,#0e1621,#17212b)}
.auth{background:#17212b;color:#f2f5f7;border:1px solid #263746}
.auth h1{color:#65b9f5}

</style>
</head>
<body>
<div id="authView" class="authwrap">
 <form class="auth" id="authForm">
  <div class="logo">➤</div><h1>KaGramm</h1><p id="authCaption">Войди или создай аккаунт, чтобы общаться</p>
  <input id="email" type="email" placeholder="Электронная почта" autocomplete="email" required>
  <input id="password" type="password" placeholder="Пароль (не менее 6 символов)" autocomplete="current-password" required minlength="6">
  <input id="username" placeholder="Имя пользователя (для регистрации)" autocomplete="username" maxlength="24">
  <button class="btn" id="authSubmit">Войти</button>
  <button type="button" class="ghost" id="toggleAuth">Создать аккаунт</button>
  <div class="error" id="authError"></div>
 </form>
</div>
<div class="app hidden" id="app">
 <aside class="sidebar">
  <div class="top"><div class="brand"><div class="logo">➤</div>KaGramm</div><button class="ghost" id="logout" title="Выйти">⇥</button></div>
  <div class="search"><input id="filter" placeholder="Поиск по чатам"></div>
  <div class="chats" id="chatList"></div>
  <form class="newchat" id="newChatForm"><input id="targetUid" placeholder="UID собеседника"><button class="btn">Чат</button></form>
  <div class="notice" id="meLabel">Подключено к Firebase</div>
 </aside>
 <main class="main">
  <div class="empty" id="empty"><div class="logo" style="margin:auto">➤</div><h2>KaGramm</h2><p>Выбери чат или создай новый по UID пользователя</p></div>
  <section id="room" class="hidden" style="height:100%;display:flex;flex-direction:column">
   <header class="head"><button class="ghost" id="back">‹</button><div class="avatar" id="peerAvatar">K</div><div><div class="headtitle" id="peerName">Чат</div><div class="sub">Личная переписка</div></div></header>
   <div class="messages" id="messages"></div>
   <form class="composer" id="sendForm">
    <input id="message" placeholder="Сообщение..." maxlength="4000" autocomplete="off">
    <div class="tools">
     <label class="ghost" title="Фото или видео">＋<input id="media" class="hidden" type="file" accept="image/*,video/*"></label>
     <button class="ghost" type="button" id="voice" title="Записать голосовое">🎙</button>
    </div><button class="send">➤</button>
   </form>
  </section>
 </main>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,collection,addDoc,query,where,onSnapshot,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-storage.js";

const firebaseConfig={
 apiKey:"AIzaSyDpjyYk6iaomApYfI3wZ2UHRVeLlqV986s",
 authDomain:"grammol.firebaseapp.com",
 projectId:"grammol",
 storageBucket:"grammol.firebasestorage.app",
 messagingSenderId:"892818335182",
 appId:"1:892818335182:web:e238dc4da1bd037210379f",
 measurementId:"G-63MRVB52B9"
};
const appFB=initializeApp(firebaseConfig),auth=getAuth(appFB),db=getFirestore(appFB),storage=getStorage(appFB);
const $=id=>document.getElementById(id);
let registering=false,me=null,activeChat=null,unsubChats=null,unsubMessages=null,recorder=null,recordChunks=[];
$('toggleAuth').onclick=()=>{registering=!registering;$('username').classList.toggle('hidden',!registering);$('authSubmit').textContent=registering?'Зарегистрироваться':'Войти';$('toggleAuth').textContent=registering?'У меня уже есть аккаунт':'Создать аккаунт';$('authCaption').textContent=registering?'Создай аккаунт KaGramm':'Войди в KaGramm';$('authError').textContent=''};
$('username').classList.add('hidden');
$('authForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const submit=$('authSubmit');
 $('authError').textContent='';
 submit.disabled=true;
 submit.textContent='Подождите...';
 try{
  const email=$('email').value.trim().toLowerCase();
  const password=$('password').value;
  if(registering){
   const username=$('username').value.trim();
   if(username.length<3) throw Error('Имя пользователя должно содержать минимум 3 символа');
   const cred=await createUserWithEmailAndPassword(auth,email,password);
   // Auth account is already created. Profile metadata is best-effort and
   // must not keep the user trapped on the registration screen.
   try{await updateProfile(cred.user,{displayName:username})}catch(profileError){console.warn('Не удалось обновить имя профиля:',profileError)}
   try{
    await setDoc(doc(db,'users',cred.user.uid),{
     uid:cred.user.uid,username,usernameLower:username.toLowerCase(),createdAt:serverTimestamp()
    },{merge:true});
   }catch(profileError){
    console.warn('Аккаунт создан, но профиль Firestore пока не сохранён:',profileError);
    $('authError').textContent='Аккаунт создан. Профиль не удалось сохранить — проверь правила Firestore.';
   }
   // onAuthStateChanged will switch to the messenger as soon as Firebase
   // publishes the authenticated user.
  }else{
   await signInWithEmailAndPassword(auth,email,password);
  }
 }catch(err){
  $('authError').textContent=humanError(err);
 }finally{
  submit.disabled=false;
  submit.textContent=registering?'Зарегистрироваться':'Войти';
 }
});
function humanError(e){const m=e?.code||e?.message||'';return ({'auth/email-already-in-use':'Этот email уже зарегистрирован','auth/invalid-email':'Неверный email','auth/weak-password':'Пароль слишком простой','auth/invalid-credential':'Неверный email или пароль','auth/network-request-failed':'Проверь интернет-соединение','permission-denied':'Нет доступа. Проверь правила Firestore/Storage.'})[m]||m}
onAuthStateChanged(auth,user=>{
 if(user){
  me=user;
  $('authView').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('meLabel').textContent='Вы: '+(user.displayName||user.email)+' · UID: '+user.uid;
  try{listenChats()}catch(err){console.error(err);$('meLabel').textContent='Вход выполнен, но не удалось загрузить чаты: '+humanError(err)}
 }else{
  me=null;activeChat=null;
  $('app').classList.add('hidden');
  $('authView').classList.remove('hidden');
  if(unsubChats){unsubChats();unsubChats=null}
  if(unsubMessages){unsubMessages();unsubMessages=null}
 }
});
$('logout').onclick=()=>signOut(auth);
function listenChats(){if(unsubChats)unsubChats();const q=query(collection(db,'chats'),where('members','array-contains',me.uid));unsubChats=onSnapshot(q,snap=>{const list=$('chatList');list.innerHTML='';const docs=snap.docs.sort((a,b)=>(b.data().updatedAt?.seconds||0)-(a.data().updatedAt?.seconds||0));docs.forEach(d=>{const c=d.data(),peer=c.members.find(x=>x!==me.uid)||me.uid,el=document.createElement('div');el.className='chat'+(activeChat===d.id?' sel':'');el.innerHTML='<div class="avatar">K</div><div class="chatinfo"><div class="name"></div><div class="preview"></div></div>';el.querySelector('.name').textContent=c.title||('Пользователь '+peer.slice(0,7));el.querySelector('.preview').textContent=c.lastMessage||'Начните общение';el.onclick=()=>openChat(d.id,c,peer);list.appendChild(el)})},err=>{$('meLabel').textContent='Ошибка загрузки чатов: '+humanError(err);console.error(err)})}
$('newChatForm').onsubmit=async e=>{e.preventDefault();const target=$('targetUid').value.trim();if(!target)return;if(target===me.uid){alert('Нельзя создать чат с самим собой');return}try{const userSnap=await getDoc(doc(db,'users',target));if(!userSnap.exists())throw Error('Пользователь с таким UID не найден. Попроси его прислать UID из KaGramm.');const members=[me.uid,target].sort();const chatId=members.join('_');await setDoc(doc(db,'chats',chatId),{members,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),lastMessage:'Чат создан'},{merge:true});$('targetUid').value='';}catch(err){alert(humanError(err))}};
function openChat(id,data,peer){activeChat=id;$('empty').classList.add('hidden');$('room').classList.remove('hidden');$('app').classList.add('open');$('peerName').textContent=data.title||('Пользователь '+peer.slice(0,8));$('peerAvatar').textContent=(data.title||'K')[0].toUpperCase();if(unsubMessages)unsubMessages();const q=query(collection(db,'chats',id,'messages'),orderBy('createdAt','asc'));unsubMessages=onSnapshot(q,snap=>{const root=$('messages'),nearBottom=root.scrollHeight-root.scrollTop-root.clientHeight<120;root.innerHTML='';snap.forEach(d=>renderMessage(root,d.data()));if(nearBottom)root.scrollTop=root.scrollHeight},err=>{$('meLabel').textContent='Ошибка загрузки чатов: '+humanError(err);console.error(err)})}
$('back').onclick=()=>{$('app').classList.remove('open')};
function renderMessage(root,m){const b=document.createElement('div');b.className='bubble '+(m.sender===me.uid?'mine':'theirs');if(m.type==='image'){const img=document.createElement('img');img.src=m.url;img.alt='Фото';b.appendChild(img)}else if(m.type==='video'){const v=document.createElement('video');v.src=m.url;v.controls=true;v.playsInline=true;b.appendChild(v)}else if(m.type==='audio'){const a=document.createElement('audio');a.src=m.url;a.controls=true;b.appendChild(a)}else{const t=document.createElement('div');t.textContent=m.text||'';b.appendChild(t)}const meta=document.createElement('div');meta.className='meta';meta.textContent=m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';b.appendChild(meta);root.appendChild(b)}
async function sendData(payload){if(!activeChat)throw Error('Сначала открой чат');await addDoc(collection(db,'chats',activeChat,'messages'),{...payload,sender:me.uid,createdAt:serverTimestamp()});await setDoc(doc(db,'chats',activeChat),{lastMessage:payload.text||({image:'Фото',video:'Видео',audio:'Голосовое сообщение'}[payload.type]||'Вложение'),updatedAt:serverTimestamp()},{merge:true})}
$('sendForm').onsubmit=async e=>{e.preventDefault();const text=$('message').value.trim();if(!text)return;try{$('message').value='';await sendData({type:'text',text})}catch(err){alert(humanError(err))}};
async function uploadAndSend(file,type){if(!activeChat)throw Error('Сначала открой чат');if(file.size>50*1024*1024)throw Error('Файл больше 50 МБ');const path=`chats/${activeChat}/${me.uid}/${Date.now()}_${file.name||type}`;const r=ref(storage,path);await uploadBytes(r,file);const url=await getDownloadURL(r);await sendData({type,url,text:file.name||type})}
$('media').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await uploadAndSend(f,f.type.startsWith('video/')?'video':'image')}catch(err){alert(humanError(err))}e.target.value=''};
$('voice').onclick=async()=>{if(!activeChat)return alert('Сначала открой чат');if(recorder&&recorder.state==='recording'){recorder.stop();$('voice').textContent='🎙';return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);recordChunks=[];recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});try{await uploadAndSend(new File([blob],'voice.webm',{type:blob.type}),'audio')}catch(err){alert(humanError(err))}};recorder.start();$('voice').textContent='■';}catch(err){alert('Не удалось включить микрофон: '+err.message)}};
</script>
</body></html>
